#view.swap{opacity:0;transform:scale(.985);filter:blur(4px);transition:.12s}
::view-transition-old(root){animation:.2s ease both vtOut}::view-transition-new(root){animation:.28s cubic-bezier(.2,.7,.2,1) both vtIn}
@keyframes vtOut{to{opacity:0;transform:scale(.98);filter:blur(6px)}}@keyframes vtIn{from{opacity:0;transform:scale(1.02);filter:blur(6px)}}
#intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#0F6B57,#04201A);color:#fff;transition:opacity .5s ease,filter .5s ease,transform .5s ease}

.coin:nth-child(1){--dx:-18px;animation-delay:.05s}.coin:nth-child(2){--dx:10px;animation-delay:.3s}.coin:nth-child(3){--dx:-4px;animation-delay:.55s}
@keyframes drop{0%{opacity:0;transform:translate(var(--dx),-60px) rotate(-30deg)}15%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translate(var(--dx),118px) rotate(300deg) scale(.85)}}

@keyframes wb{30%{transform:scale(1.08,.94)}60%{transform:scale(.97,1.04)}}@keyframes wf{to{opacity:0;transform:scale(.5)}}

@keyframes pop{to{opacity:1;transform:none}}
#intro .gr{font-size:clamp(22px,7vw,28px);font-weight:800;letter-spacing:-.5px;opacity:0;text-align:center;padding:0 20px;animation:up .6s ease 1.35s forwards}

<script>
// ---------- storage (IndexedDB, local only) ----------
const WORKER='https://money-ai.arnob428.workers.dev';
const DB='money-db';
const idb=()=>new Promise((res,rej)=>{const q=indexedDB.open(DB,1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
async function kvGet(k){try{const d=await idb();return await new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}}
async function kvSet(k,v){try{const d=await idb();d.transaction('kv','readwrite').objectStore('kv').put(v,k)}catch(e){}}
// ---------- country packs ----------
const PACKS={
BD:{cur:'BDT',w:[['cash','Cash',['cash']],['bkash','bKash',['bkash','b-kash']],['cards','Cards',['card','visa','master']]],save:[['FDR','Fixed deposit at a bank'],['DPS','Monthly deposit scheme'],['Savings certificates','Government savings certificates']],stores:'wet markets and bazaars, supershops such as Shwapno and Agora, and delivery apps such as Chaldal',cycle:'monthly'},
CA:{cur:'CAD',w:[['cash','Cash',['cash']],['debit','Debit',['debit','interac']],['credit','Credit card',['credit','visa','master','amex']],['etransfer','e-Transfer',['e-transfer','etransfer','e transfer']]],save:[['TFSA','Tax-free savings account'],['RRSP','Registered retirement savings plan'],['FHSA','First home savings account'],['GIC or high-interest savings','Fixed-term or high-interest deposits']],stores:'No Frills, Walmart, Costco, T&T, Loblaws or Real Canadian Superstore, and delivery such as Instacart',cycle:'biweekly'},
US:{cur:'USD',w:[['cash','Cash',['cash']],['debit','Debit',['debit']],['credit','Credit card',['credit','visa','master','amex']],['transfer','Zelle or Venmo',['zelle','venmo']]],save:[['401(k) or IRA','Retirement accounts'],['High-yield savings','Online savings accounts'],['CDs','Fixed-term deposits']],stores:'Walmart, Costco, Aldi, Kroger, Trader Joe\'s, and delivery such as Instacart',cycle:'biweekly'},
GB:{cur:'GBP',w:[['cash','Cash',['cash']],['debit','Debit',['debit']],['credit','Credit card',['credit','visa','master','amex']],['transfer','Bank transfer',['transfer']]],save:[['ISA','Tax-free savings or investing account'],['Premium Bonds','NS&I prize savings'],['Pension','Workplace or personal pension']],stores:'Tesco, Aldi, Lidl, Sainsbury\'s, Asda, and delivery such as Ocado',cycle:'monthly'},
AU:{cur:'AUD',w:[['cash','Cash',['cash']],['debit','Debit',['debit']],['credit','Credit card',['credit','visa','master','amex']],['transfer','Bank transfer',['transfer','payid']]],save:[['Superannuation','Retirement savings'],['High-interest savings','Bank savings accounts'],['Term deposits','Fixed-term deposits']],stores:'Woolworths, Coles, Aldi, and delivery apps',cycle:'fortnightly'}};
const GEN=[['cash','Cash',['cash']],['debit','Debit card',['debit']],['credit','Credit card',['credit','visa','master']],['mobile','Mobile wallet',['wallet','pay']]];
const CURM={BD:'BDT',CA:'CAD',US:'USD',GB:'GBP',AU:'AUD',NZ:'NZD',IN:'INR',PK:'PKR',LK:'LKR',NP:'NPR',AE:'AED',SA:'SAR',QA:'QAR',KW:'KWD',MY:'MYR',SG:'SGD',ID:'IDR',TH:'THB',PH:'PHP',VN:'VND',JP:'JPY',KR:'KRW',CN:'CNY',HK:'HKD',DE:'EUR',FR:'EUR',IT:'EUR',ES:'EUR',NL:'EUR',BE:'EUR',AT:'EUR',IE:'EUR',PT:'EUR',FI:'EUR',GR:'EUR',CH:'CHF',SE:'SEK',NO:'NOK',DK:'DKK',PL:'PLN',ZA:'ZAR',NG:'NGN',KE:'KES',EG:'EGP',TR:'TRY',BR:'BRL',MX:'MXN'};
const cname=cc=>{try{return new Intl.DisplayNames(['en'],{type:'region'}).of(cc)}catch(e){return cc}};
const DEF={v:2,theme:'system',density:'comfortable',hide:false,savePct:20,bills:0,workerUrl:WORKER,open:{},openCur:'USD',wallets:[],packIds:[],region:{country:'US',city:'',cur:'USD'},pin:false,pending:null,fx:{rates:{},ts:0},manualRates:{},goals:[],onboarded:false,sg:[],bl:[],debts:[],rates:{},chat:[],tx:[],reflect:{},budgetOverride:{},lastGeo:0,extra:null,profile:{name:'',age:'',job:'',paySet:false,pay:{freq:'monthly',day:1,wd:5,d2:15,anchor:''}},quiz:{a:[],sum:'',done:false},sync:{on:false,code:'',ts:0},del:[],ts:0,metals:{},zk:{},em:{}};
let S=JSON.parse(JSON.stringify(DEF));
const save=()=>{S.ts=Date.now();kvSet('state',S);if(typeof qSync==='function')qSync()};
let WAL={};
function syncWal(){WAL={};S.wallets.forEach(w=>WAL[w.id]=w.name)}
function VW(){const used=new Set(S.tx.map(t=>t.wallet).concat(S.tx.map(t=>t.to).filter(Boolean)));return S.wallets.filter(w=>S.packIds.includes(w.id)||used.has(w.id)||(S.open[w.id]||0)!==0).map(w=>w.id)}
function applyPack(cc,city){const p=PACKS[cc];const cur=p?p.cur:(CURM[cc]||'USD');S.region={country:cc,city:city||'',cur};const ws=p?p.w:GEN;S.packIds=ws.map(x=>x[0]);ws.forEach(([id,name,al])=>{if(!S.wallets.find(w=>w.id===id))S.wallets.push({id,name,al})});syncWal();if(!S.openCur||!Object.keys(S.open).length)S.openCur=cur}
const pack=()=>PACKS[S.region.country]||{save:(S.extra&&S.extra.country===S.region.country?S.extra.save:[])||[],stores:(S.extra&&S.extra.country===S.region.country?S.extra.stores:'')||'common local grocery stores and markets',cycle:'monthly'};
// ---------- helpers ----------
const $=s=>document.querySelector(s);
function fmt(n,c=S.region.cur,dec){const a=Math.abs(n);if(c==='BDT')return(n<0?'-':'')+'৳'+(dec?a.toLocaleString('en-US',{maximumFractionDigits:2}):Math.round(a).toLocaleString('en-US'));try{return new Intl.NumberFormat('en-US',{style:'currency',currency:c,minimumFractionDigits:dec?2:0,maximumFractionDigits:dec?2:0}).format(n)}catch(e){return c+' '+Math.round(n)}}
const taka=n=>fmt(Math.round(n));
const m=h=>`<span class="m">${h}</span>`;
const now=()=>new Date();
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const ym=d=>ymd(d).slice(0,7);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CATS=['Groceries','Eating out','Dates','Transport','Fitness & health','Fun & outings','Family & gifts','Bills','Other'];
const toast=t=>{const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2800)};
const haptic=()=>{try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}};
// ---------- currency ----------
const rate=c=>c==='USD'?1:(S.manualRates[c]||S.fx.rates[c]);
function conv(a,from,to=S.region.cur){if(!from||from===to)return a;const rf=rate(from),rt=rate(to);if(!rf||!rt)return a;return a/rf*rt}
const cur0=t=>t.cur||S.openCur||'BDT';
const cv=t=>conv(t.amount,cur0(t));
const missingRate=()=>{const need=new Set([S.region.cur,S.openCur,...S.tx.map(cur0)]);return[...need].filter(c=>c&&!rate(c))};
async function loadFx(){if(Date.now()-S.fx.ts<6*3600e3&&Object.keys(S.fx.rates).length)return;try{const r=await fetch(S.workerUrl.replace(/\/$/,'')+'/fx');const j=await r.json();if(j.rates&&Object.keys(j.rates).length){S.fx={rates:j.rates,ts:Date.now()};save();if(!document.activeElement||document.activeElement===document.body)render()}}catch(e){}}
// ---------- math ----------
function bal(){const b={};S.wallets.forEach(w=>b[w.id]=conv(S.open[w.id]||0,S.openCur));for(const t of S.tx){const a=cv(t);if(t.type==='inc')b[t.wallet]=(b[t.wallet]||0)+a;else if(t.type==='exp')b[t.wallet]=(b[t.wallet]||0)-a;else{b[t.wallet]=(b[t.wallet]||0)-a;b[t.to]=(b[t.to]||0)+a}}return b}
function month(d=now()){const k=ym(d);const tx=S.tx.filter(t=>ymd(new Date(t.ts)).slice(0,7)===k);return{tx,inc:tx.filter(t=>t.type==='inc').reduce((a,t)=>a+cv(t),0),exp:tx.filter(t=>t.type==='exp').reduce((a,t)=>a+cv(t),0)}}
const WEIGHTS=[['Groceries',30],['Eating out',10],['Dates',14],['Transport',10],['Fitness & health',12],['Fun & outings',8],['Family & gifts',14],['Other',2]];

const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function key(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function enc(pw,obj){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const c=await crypto.subtle.encrypt({name:'AES-GCM',iv},await key(pw,salt),new TextEncoder().encode(JSON.stringify(obj)));return JSON.stringify({money:1,salt:b64(salt),iv:b64(iv),data:b64(c)})}
async function dec(pw,txt){const j=JSON.parse(txt);const p=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(j.iv)},await key(pw,unb64(j.salt)),unb64(j.data));return JSON.parse(new TextDecoder().decode(p))}

 if(f==='monthly'){for(let k=0;k<3;k++){const b=new Date(from.getFullYear(),from.getMonth()+k,1);const d=new Date(b.getFullYear(),b.getMonth(),Math.min(p.day||1,dim(b.getFullYear(),b.getMonth())));if(d>=from)return d}}

function payText(){const p=S.profile.pay,f=p.freq;if(f==='monthly')return'Monthly, '+(p.day>=31?'last day':ord(p.day||1));if(f==='semimonthly')return'Twice a month, '+ord(p.day||1)+' and '+ord(p.d2||15);if(f==='weekly')return'Weekly, '+DAYS[p.wd??5];if(f==='biweekly')return'Every 2 weeks'+(p.anchor?', next '+p.anchor:', '+DAYS[p.wd??5]);return'Irregular'+(p.anchor?', next '+p.anchor:'')}

function nextDue(d){const s=d.sched;if(!s||!(s.amt>0)||(s.n&&(s.paid||0)>=s.n)||d.amount<=0)return null;const t=day0(now());const st=s.start?pd(s.start):null;

 const pos=x=>Math.min(100,Math.round(x/(max||1)*100));
 v.innerHTML=`<h1 class="r">Emergency fund</h1>
 <div class="r hero"><div style="font-size:12px;font-weight:700;color:var(--herosub)">You are covered for</div><div class="big fit">${need>0?cov.toFixed(1)+' months':'Not enough data yet'}</div><div style="font-size:12px;color:var(--herosub);margin-top:8px">${need>0?'Comfortable monthly need '+m(taka(need)):'Log about two weeks of spending, or enter your monthly essentials below.'}</div></div>
 ${need>0?`<div class="r card"><h2>Your safety range</h2><div style="position:relative;margin:14px 0 24px"><div class="bar" style="height:12px"><i class="${cov<2?'over':''}" style="width:${pos(liquid)}%"></i></div><div class="muted" style="position:absolute;left:50%;top:16px;transform:translateX(-50%);font-size:11px">2 mo</div><div class="muted" style="position:absolute;left:${pos(tgt)}%;top:16px;transform:translateX(-50%);font-size:11px;color:var(--brand);font-weight:800">${m0} mo</div><div class="muted" style="position:absolute;right:0;top:16px;font-size:11px">4 mo</div></div>
 <div class="li row"><span>Minimum, 2 months</span><b>${m(taka(min))}</b></div><div class="li row"><span>Your target, ${m0} months</span><b>${m(taka(tgt))}</b></div><div class="li row"><span>Very comfortable, 4 months</span><b>${m(taka(max))}</b></div><div class="li row"><span>Available now</span><b>${m(taka(liquid))}</b></div></div>
 <div class="r card"><h2>${gap>0?'Closing the gap':'You have reached your target'}</h2>${gap>0?`<div class="li row"><span>Still to save</span><b>${m(taka(gap))}</b></div><div class="li row"><span>In 6 months</span><b>${m(taka(gap/6))} a month</b></div><div class="li row"><span>In 12 months</span><b>${m(taka(gap/12))} a month</b></div>${sav>0?`<div class="muted" style="margin-top:6px">At your ${S.savePct}% saving rate (${m(taka(sav))} a month) you get there in about ${Math.ceil(gap/sav)} months.</div>`:'<div class="muted" style="margin-top:6px">Log your pay to see how long your current saving rate takes.</div>'}<button class="btn g" id="eg" style="margin-top:10px;width:100%">Create an Emergency fund goal</button>`:'<div class="muted">Keep it somewhere you can reach within a day, separate from daily spending.</div>'}</div>`:''}
 <div class="r card"><h2>Tune it</h2><div class="muted">Months you want covered</div><div>${[2,3,4].map(x=>`<span class="chip ${m0===x?'on':''}" data-em="${x}">${x} months</span>`).join('')}</div><div class="muted">Default is ${(S.profile.pay.freq==='irregular'||fam)?4:3}: irregular pay or dependants point to 4, steady salary to 3.</div>
 <div class="muted" style="margin-top:10px">Monthly essentials (leave empty to use your log)</div><input data-e="ess" type="number" inputmode="decimal" placeholder="${need>0?Math.round(need):'Amount'}" value="${E.ess||''}"><div class="muted" style="margin-top:10px">Savings held elsewhere that you can reach quickly</div><input data-e="other" type="number" inputmode="decimal" placeholder="Amount" value="${E.other||''}">
 <div class="muted" style="margin-top:8px">Need = essentials (groceries, bills, transport, health, family) plus 40% of other spending, from your last 90 days.</div></div>
 <div class="r muted" style="font-size:12px">Planning aid, not financial advice.</div>`;
 document.querySelectorAll('[data-em]').forEach(e=>e.onclick=()=>{E.months=+e.dataset.em;save();render()});
 document.querySelectorAll('[data-e]').forEach(e=>e.onchange=()=>{E[e.dataset.e]=Math.max(0,parseFloat(e.value)||0);save();render()});
 const eg=$('#eg');if(eg)eg.onclick=()=>{if(!S.sg.find(g=>g.name==='Emergency fund'))S.sg.push({id:Date.now(),name:'Emergency fund',target:Math.round(tgt),saved:0});save();toast('Goal added in Plan');}}
// ---------- encrypted cross-device sync ----------
let syncT=null,syncMsg='';
const syncOn=()=>S.sync&&S.sync.on&&S.sync.code;
async function sid(c){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('money-sync-id:'+c));return[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}
function qSync(){if(!syncOn())return;clearTimeout(syncT);syncT=setTimeout(syncNow,45000)}
function mergeState(r){const gone=new Set([...(S.del||[]),...(r.del||[])]);const mp=new Map();for(const t of[...(r.tx||[]),...S.tx])if(!gone.has(t.id)&&!mp.has(t.id))mp.set(t.id,t);
 const base=(r.ts||0)>(S.ts||0)?r:S;const sy=S.sync,ts=Math.max(r.ts||0,S.ts||0);const n=JSON.parse(JSON.stringify(base));n.tx=[...mp.values()].sort((a,b)=>a.ts-b.ts);n.del=[...gone].slice(-500);n.sync=sy;n.ts=ts;const changed=base===r;load(n);kvSet('state',S);return changed}
async function syncNow(){if(!syncOn())return false;clearTimeout(syncT);const url=S.workerUrl.replace(/\/$/,'')+'/sync/'+await sid(S.sync.code);
 try{const r=await fetch(url);let ch=false;if(r.ok){ch=mergeState(await dec(S.sync.code,await r.text()))}else if(r.status!==404)throw new Error(r.status===501?'Server sync is not set up yet':'Server error '+r.status);
  const o=JSON.parse(JSON.stringify(S));o.sync={on:false,code:'',ts:0};const p=await fetch(url,{method:'PUT',body:await enc(S.sync.code,o)});if(!p.ok)throw new Error('Upload failed ('+p.status+')');
  S.sync.ts=Date.now();kvSet('state',S);syncMsg='Synced '+new Date().toLocaleTimeString('en',{hour:'2-digit',minute:'2-digit'});if(ch&&(!document.activeElement||document.activeElement===document.body))render();return true}
 catch(e){syncMsg='Sync problem: '+(e.message.includes('decrypt')||e.name==='OperationError'?'wrong sync code for this data':e.message);return false}}
function bindSettingsExtra(v){const P=S.profile;
 const pn=$('#sn'),pa=$('#sa'),pj=$('#sj');[pn,pa,pj].forEach(e=>e&&(e.onchange=()=>{P.name=pn.value.trim().slice(0,40);P.age=pa.value.trim();P.job=pj.value.trim().slice(0,40);save();toast('Profile saved')}));
 bindPay();$('#redo').onclick=()=>{S.quiz={a:[],sum:'',done:false};QS=[];wiz=2;wizOn=true;lastPg=0;render()};
 $('#son').onclick=async()=>{const c=$('#sc').value.trim();if(c.length<8)return toast('Use a code of 8+ characters');S.sync={on:true,code:c,ts:S.sync.ts||0};save();$('#sst').textContent='Syncing...';await syncNow();render()};
 const off=$('#soff');if(off)off.onclick=()=>{S.sync={on:false,code:'',ts:0};save();render()}}
// ---------- boot ----------
function initRegion(){const cc=((navigator.language||'en-US').split('-')[1]||'US').toUpperCase();applyPack(CURM[cc]||PACKS[cc]?cc:'US','')}
function load(s){const v1=!s.region;S=JSON.parse(JSON.stringify(DEF));Object.assign(S,s);S.open={...(s.open||{})};['sg','bl','debts','chat'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});if(!S.rates)S.rates={};if(!Array.isArray(S.wallets))S.wallets=[];if(v1){S.region={country:'BD',city:'Dhaka',cur:'BDT'};S.wallets=[];S.packIds=[];applyPack('BD','Dhaka');S.openCur='BDT';S.onboarded=true}S.profile=Object.assign(JSON.parse(JSON.stringify(DEF.profile)),s.profile||{});S.profile.pay=Object.assign({},DEF.profile.pay,(s.profile||{}).pay||{});S.quiz=Object.assign({a:[],sum:'',done:false},s.quiz||{});S.quiz.a=S.quiz.a||[];S.sync=Object.assign({on:false,code:'',ts:0},s.sync||{});S.del=s.del||[];S.metals=s.metals||{};S.zk=s.zk||{};S.em=s.em||{};S.v=2;if(!S.workerUrl)S.workerUrl=WORKER;S.fx=S.fx||{rates:{},ts:0};S.manualRates=S.manualRates||{};S.goals=S.goals||[];S.packIds=S.packIds||[];syncWal()}
(async()=>{const s=await kvGet('state');if(s)load(s);else initRegion();
 matchMedia('(prefers-color-scheme:dark)').addEventListener&&matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>S.theme==='system'&&applyTheme());
 autoLog();render();loadFx();loadMetals();playIntro(S.profile.name,!S.onboarded);if(S.onboarded)detect(false);syncNow();
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){syncNow();return}if(document.visibilityState==='visible'&&S.onboarded){autoLog();detect(false);loadFx();loadMetals();syncNow()}});
 if(new URLSearchParams(location.search).get('add')&&S.onboarded)openAdd('exp');
 if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{})})();
