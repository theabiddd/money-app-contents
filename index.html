<!doctype html>
<html lang="en">
<head>

<title>Money</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
:root{--bg:#EDF5F2;--card:rgba(255,255,255,.58);--ink:#0F201B;--muted:#4A625C;--brand:#0F6B57;--onbrand:#fff;--soft:rgba(15,107,87,.12);--soft2:rgba(15,107,87,.08);--line:rgba(15,70,58,.13);--bar2:#74C5B0;--hero:#0B5A4A;--herosub:#CDEFE6;--glass:rgba(255,255,255,.62);--orb:#6FD0B8;--dot:#BCD8D0;--shadow:0 12px 34px rgba(8,70,56,.18);--edge:rgba(255,255,255,.75);--hl:inset 0 1px 0 rgba(255,255,255,.85);--bad:#B3261E}
:root[data-theme=dark]{--bg:#06120F;--card:rgba(26,52,45,.5);--ink:#E8F5F0;--muted:#93B0A7;--brand:#4DD4B0;--onbrand:#04201A;--soft:rgba(77,212,176,.16);--soft2:rgba(77,212,176,.1);--line:rgba(160,230,210,.14);--bar2:#2A8F77;--hero:#0F5F4D;--glass:rgba(18,40,34,.6);--orb:#14806A;--dot:#16302A;--shadow:0 12px 34px rgba(0,0,0,.55);--edge:rgba(190,255,235,.16);--hl:inset 0 1px 0 rgba(190,255,235,.12);--bad:#F2B8B5}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display',system-ui,sans-serif;font:-apple-system-body;font-size:16px;font-variant-numeric:tabular-nums;overflow:hidden}
body.compact .card{padding:12px}
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.orb{position:absolute;border-radius:50%;filter:blur(46px);opacity:.8;background:var(--orb)}
.o1{width:260px;height:260px;top:-70px;right:-90px;animation:d1 16s ease-in-out infinite}
.o2{width:230px;height:230px;bottom:140px;left:-110px;animation:d2 20s ease-in-out infinite}
.grid{position:absolute;inset:0;background-image:radial-gradient(var(--dot) 1.2px,transparent 1.2px);background-size:22px 22px;-webkit-mask-image:linear-gradient(180deg,#000,transparent 70%);mask-image:linear-gradient(180deg,#000,transparent 70%);opacity:.7}
@keyframes d1{50%{transform:translate(40px,60px)}}@keyframes d2{50%{transform:translate(-50px,-40px)}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
#view{position:fixed;inset:0;z-index:1;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 112px);display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
#view.nonav{padding-bottom:calc(env(safe-area-inset-bottom) + 24px)}
.r{opacity:0;animation:up .55s cubic-bezier(.2,.7,.2,1) forwards}
.card{background:var(--card);border-radius:22px;padding:16px;-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--edge);box-shadow:var(--hl),0 8px 24px rgba(8,60,48,.08)}
.hero{background:var(--hero);color:#fff;border-radius:26px;padding:18px;box-shadow:var(--shadow)}
h1{font-size:30px;margin:0;letter-spacing:-.8px}h2{font-size:15px;margin:0 0 6px}
.muted{color:var(--muted);font-size:13px}.big{font-size:38px;font-weight:800;letter-spacing:-1px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.li{padding:10px 0;border-bottom:1px solid var(--line)}.li:last-child{border:0}
.bar{height:7px;border-radius:4px;background:var(--soft);overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:var(--brand);border-radius:4px;transition:width .8s cubic-bezier(.2,.7,.2,1)}
.bar i.over{background:var(--bad)}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:0;background:var(--brand);color:var(--onbrand);border-radius:24px;padding:13px 18px;font-weight:800;cursor:pointer}
.btn.g{background:var(--soft2);color:var(--brand);border:1px solid var(--line)}
.btn:active,.chip:active,.tab:active{transform:scale(.96)}
.chip{display:inline-block;padding:8px 13px;border-radius:17px;font-size:13px;font-weight:600;background:var(--soft2);border:1px solid var(--line);cursor:pointer;margin:0 6px 6px 0}
.chip.on{background:var(--brand);color:var(--onbrand);font-weight:800}
input,select,textarea{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--soft2);outline:0}
.seg{display:flex;background:var(--soft2);border-radius:20px;padding:4px;border:1px solid var(--line)}
.seg b{flex:1;text-align:center;padding:9px 0;border-radius:16px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}.seg b.on{background:var(--brand);color:var(--onbrand);font-weight:800}
#nav{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);height:68px;z-index:5;border-radius:34px;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;align-items:center;padding:0 7px;gap:6px}
#nav.off{display:none}
#fab{flex:none;width:52px;height:52px;border-radius:26px;background:var(--brand);border:0;display:grid;place-items:center;cursor:pointer;animation:pulse 2.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(82,196,143,.5)}100%{box-shadow:0 0 0 16px rgba(82,196,143,0)}}
#strip{flex:1;min-width:0;overflow-x:auto;display:flex;gap:2px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 10px,#000 calc(100% - 26px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 10px,#000 calc(100% - 26px),transparent 100%)}
#strip::-webkit-scrollbar{display:none}
.tab{flex:none;width:60px;height:54px;border-radius:19px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--muted);cursor:pointer}.tab.on{background:var(--soft);color:var(--brand);font-weight:800}
svg{display:block}
#modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.35);display:none;align-items:flex-end}
#modal.show{display:flex}
#sheet{width:100%;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);animation:sheet .3s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column;gap:12px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.keys button{padding:14px 0;border-radius:16px;border:1px solid var(--line);background:var(--card);font-size:20px;font-weight:700;cursor:pointer}
.amt{font-size:42px;font-weight:800;text-align:center;letter-spacing:-1px}
.pos{color:var(--brand);font-weight:800}
.hide .m{filter:blur(9px)}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--hero);color:#fff;padding:10px 16px;border-radius:18px;z-index:30;font-size:13px;font-weight:700;max-width:90%;text-align:center}
a{color:var(--brand)}
@media (prefers-reduced-motion:reduce){.r,.orb{animation:none;opacity:1}}
</style>
</head>
<body>
<div class="bg"><div class="grid"></div><div class="orb o1"></div><div class="orb o2"></div></div>
<div id="view"></div>
<div id="nav"><button id="fab" aria-label="Add"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--onbrand)" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button><div style="flex:none;width:1px;height:30px;background:var(--line)"></div><div id="strip"></div></div>
<div id="modal"><div id="sheet"></div></div>
<script>
// ---------- storage (IndexedDB, local only) ----------
const WORKER='https://money-ai.arnob428.workers.dev';
const DB='money-db';
const idb=()=>new Promise((res,rej)=>{const q=indexedDB.open(DB,1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
async function kvGet(k){try{const d=await idb();return await new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}}
async function kvSet(k,v){try{const d=await idb();d.transaction('kv','readwrite').objectStore('kv').put(v,k)}catch(e){}}
// ---------- country packs ----------
const PACKS={
BD:{cur:'BDT',w:[['cash','Cash',['cash']],['bkash','bKash',['bkash','b-kash']],['cards','Cards',['card','visa','master']]],save:[['FDR','Fixed deposit at a bank'],['DPS','Monthly deposit scheme'],['Savings certificates','Government savings certificates']],stores:'wet markets and bazaars, supershops such as Shwapno and Agora, and delivery apps such as Chaldal',cycle:'monthly'},
CA:{cur:'CAD',w:[['cash','Cash',['cash']],['debit','Debit',['debit','interac']],['credit','Credit card',['credit','visa','master','amex']],['etransfer','e-Transfer',['e-transfer','etransfer','e transfer']]],save:[['TFSA','Tax-free savings account'],['RRSP','Registered retirement savings plan'],['FHSA','First home savings account'],['GIC or high-interest savings','Fixed-term or high-interest deposits']],stores:'No Frills, Walmart, Costco, T&T, Loblaws or Real Canadian Superstore, and delivery such as Instacart',cycle:'biweekly'},
US:{cur:'USD',w:[['cash','Cash',['cash']],['debit','Debit',['debit']],['credit','Credit card',['credit','visa','master','amex']],['transfer','Zelle or Venmo',['zelle','venmo']]],save:[['401(k) or IRA','Retirement accounts'],['High-yield savings','Online savings accounts'],['CDs','Fixed-term deposits']],stores:'Walmart, Costco, Aldi, Kroger, Trader Joe\'s, and delivery such as Instacart',cycle:'biweekly'},
GB:{cur:'GBP',w:[['cash','Cash',['cash']],['debit','Debit',['debit']],['credit','Credit card',['credit','visa','master','amex']],['transfer','Bank transfer',['transfer']]],save:[['ISA','Tax-free savings or investing account'],['Premium Bonds','NS&I prize savings'],['Pension','Workplace or personal pension']],stores:'Tesco, Aldi, Lidl, Sainsbury\'s, Asda, and delivery such as Ocado',cycle:'monthly'},
AU:{cur:'AUD',w:[['cash','Cash',['cash']],['debit','Debit',['debit']],['credit','Credit card',['credit','visa','master','amex']],['transfer','Bank transfer',['transfer','payid']]],save:[['Superannuation','Retirement savings'],['High-interest savings','Bank savings accounts'],['Term deposits','Fixed-term deposits']],stores:'Woolworths, Coles, Aldi, and delivery apps',cycle:'fortnightly'}};
const GEN=[['cash','Cash',['cash']],['debit','Debit card',['debit']],['credit','Credit card',['credit','visa','master']],['mobile','Mobile wallet',['wallet','pay']]];
const CURM={BD:'BDT',CA:'CAD',US:'USD',GB:'GBP',AU:'AUD',NZ:'NZD',IN:'INR',PK:'PKR',LK:'LKR',NP:'NPR',AE:'AED',SA:'SAR',QA:'QAR',KW:'KWD',MY:'MYR',SG:'SGD',ID:'IDR',TH:'THB',PH:'PHP',VN:'VND',JP:'JPY',KR:'KRW',CN:'CNY',HK:'HKD',DE:'EUR',FR:'EUR',IT:'EUR',ES:'EUR',NL:'EUR',BE:'EUR',AT:'EUR',IE:'EUR',PT:'EUR',FI:'EUR',GR:'EUR',CH:'CHF',SE:'SEK',NO:'NOK',DK:'DKK',PL:'PLN',ZA:'ZAR',NG:'NGN',KE:'KES',EG:'EGP',TR:'TRY',BR:'BRL',MX:'MXN'};
const cname=cc=>{try{return new Intl.DisplayNames(['en'],{type:'region'}).of(cc)}catch(e){return cc}};
const DEF={v:2,theme:'system',density:'comfortable',hide:false,savePct:20,bills:0,workerUrl:WORKER,open:{},openCur:'USD',wallets:[],packIds:[],region:{country:'US',city:'',cur:'USD'},pin:false,pending:null,fx:{rates:{},ts:0},manualRates:{},goals:[],onboarded:false,sg:[],bl:[],debts:[],rates:{},chat:[],tx:[],reflect:{},budgetOverride:{},lastGeo:0,extra:null};
let S=JSON.parse(JSON.stringify(DEF));
const save=()=>kvSet('state',S);
let WAL={};
function syncWal(){WAL={};S.wallets.forEach(w=>WAL[w.id]=w.name)}
function VW(){const used=new Set(S.tx.map(t=>t.wallet).concat(S.tx.map(t=>t.to).filter(Boolean)));return S.wallets.filter(w=>S.packIds.includes(w.id)||used.has(w.id)||(S.open[w.id]||0)!==0).map(w=>w.id)}
function applyPack(cc,city){const p=PACKS[cc];const cur=p?p.cur:(CURM[cc]||'USD');S.region={country:cc,city:city||'',cur};const ws=p?p.w:GEN;S.packIds=ws.map(x=>x[0]);ws.forEach(([id,name,al])=>{if(!S.wallets.find(w=>w.id===id))S.wallets.push({id,name,al})});syncWal();if(!S.openCur||!Object.keys(S.open).length)S.openCur=cur}
const pack=()=>PACKS[S.region.country]||{save:(S.extra&&S.extra.country===S.region.country?S.extra.save:[])||[],stores:(S.extra&&S.extra.country===S.region.country?S.extra.stores:'')||'common local grocery stores and markets',cycle:'monthly'};
// ---------- helpers ----------
const $=s=>document.querySelector(s);
function fmt(n,c=S.region.cur,dec){const a=Math.abs(n);if(c==='BDT')return(n<0?'-':'')+'৳'+(dec?a.toLocaleString('en-US',{maximumFractionDigits:2}):Math.round(a).toLocaleString('en-US'));try{return new Intl.NumberFormat('en-US',{style:'currency',currency:c,minimumFractionDigits:dec?2:0,maximumFractionDigits:dec?2:0}).format(n)}catch(e){return c+' '+Math.round(n)}}
const taka=n=>fmt(Math.round(n));
const m=h=>`<span class="m">${h}</span>`;
const now=()=>new Date();
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const ym=d=>ymd(d).slice(0,7);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CATS=['Groceries','Eating out','Dates','Transport','Fitness & health','Fun & outings','Family & gifts','Bills','Other'];
const toast=t=>{const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2800)};
const haptic=()=>{try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}};
// ---------- currency ----------
const rate=c=>c==='USD'?1:(S.manualRates[c]||S.fx.rates[c]);
function conv(a,from,to=S.region.cur){if(!from||from===to)return a;const rf=rate(from),rt=rate(to);if(!rf||!rt)return a;return a/rf*rt}
const cur0=t=>t.cur||S.openCur||'BDT';
const cv=t=>conv(t.amount,cur0(t));
const missingRate=()=>{const need=new Set([S.region.cur,S.openCur,...S.tx.map(cur0)]);return[...need].filter(c=>c&&!rate(c))};
async function loadFx(){if(Date.now()-S.fx.ts<6*3600e3&&Object.keys(S.fx.rates).length)return;try{const r=await fetch(S.workerUrl.replace(/\/$/,'')+'/fx');const j=await r.json();if(j.rates&&Object.keys(j.rates).length){S.fx={rates:j.rates,ts:Date.now()};save();if(!document.activeElement||document.activeElement===document.body)render()}}catch(e){}}
// ---------- math ----------
function bal(){const b={};S.wallets.forEach(w=>b[w.id]=conv(S.open[w.id]||0,S.openCur));for(const t of S.tx){const a=cv(t);if(t.type==='inc')b[t.wallet]=(b[t.wallet]||0)+a;else if(t.type==='exp')b[t.wallet]=(b[t.wallet]||0)-a;else{b[t.wallet]=(b[t.wallet]||0)-a;b[t.to]=(b[t.to]||0)+a}}return b}
function month(d=now()){const k=ym(d);const tx=S.tx.filter(t=>ymd(new Date(t.ts)).slice(0,7)===k);return{tx,inc:tx.filter(t=>t.type==='inc').reduce((a,t)=>a+cv(t),0),exp:tx.filter(t=>t.type==='exp').reduce((a,t)=>a+cv(t),0)}}
const WEIGHTS=[['Groceries',30],['Eating out',10],['Dates',14],['Transport',10],['Fitness & health',12],['Fun & outings',8],['Family & gifts',14],['Other',2]];
function plan(){const mo=month();const income=S.budgetOverride.income??mo.inc;const sav=Math.round(income*S.savePct/100);const bills=S.bl.length?S.bl.reduce((a,b)=>a+b.amount,0):S.bills;const pool=Math.max(0,income-sav-bills);const lines=[['Savings (paid first)',sav,null],['Rent and bills',bills,'Bills']];for(const[n,w]of WEIGHTS)lines.push([n,Math.round(pool*w/100),n]);const spent={};for(const t of mo.tx)if(t.type==='exp')spent[t.cat]=(spent[t.cat]||0)+cv(t);return{income,sav,bills,pool,lines,spent}}
function daysLeft(){const d=now();return new Date(d.getFullYear(),d.getMonth()+1,0).getDate()-d.getDate()+1}
function safe(){const p=plan();const varSpent=Object.entries(p.spent).filter(([c])=>c!=='Bills').reduce((a,[,v])=>a+v,0);const left=p.pool-varSpent;const perDay=Math.max(0,left/daysLeft());const today=S.tx.filter(t=>t.type==='exp'&&t.cat!=='Bills'&&ymd(new Date(t.ts))===ymd(now())).reduce((a,t)=>a+cv(t),0);return{p,left,perDay,today,varSpent}}
// ---------- parser (rules first, AI fallback) ----------
const CMAP=[[/lunch|dinner|breakfast|meal|restaurant|cafe|coffee|tea|biryani|burger|pizza|foodpanda|doordash|ubereats|skip the dishes|takeout|order/,'Eating out'],[/grocer|bazar|bazaar|market|rice|fish|veg|egg|chicken|chaldal|shwapno|agora|dal|oil|walmart|costco|no frills|loblaws|superstore|t&t|instacart|aldi|tesco|woolworths|coles|kroger/,'Groceries'],[/rickshaw|uber|lyft|pathao|cng|bus|fuel|petrol|gas station|train|ride|ttc|presto|transit|metro pass/,'Transport'],[/gym|medicine|pharmacy|doctor|protein|vitamin/,'Fitness & health'],[/date|girlfriend|boyfriend|gf|bf|flowers/,'Dates'],[/movie|cinema|game|outing|trip|netflix|spotify/,'Fun & outings'],[/mom|dad|family|eid|remit|send home|gift/,'Family & gifts'],[/rent|bill|wifi|internet|electric|hydro|gas bill|water|mobile|recharge|dps|loan|insurance/,'Bills']];
function parse(txt){const s=txt.toLowerCase();let a=0;const m1=s.match(/(\d+(?:[.,]\d+)*)\s*(k|tk|taka|৳|\$)?/);if(m1){a=parseFloat(m1[1].replace(/,(?=\d{3})/g,'').replace(',','.'));if(m1[2]==='k')a*=1000}
 let w=VW()[0];for(const x of S.wallets){if(!VW().includes(x.id))continue;const al=(x.al||[]).concat([x.name.toLowerCase()]);if(al.some(k=>k&&s.includes(k))){w=x.id;break}}
 const inc=/salary|paycheque|paycheck|received|got paid|income|bonus|refund/.test(s);let cat='Other';for(const[r,c]of CMAP)if(r.test(s)){cat=c;break}
 const note=txt.replace(/(\d+(?:[.,]\d+)*)\s*(k|tk|taka|৳|\$)?/i,'').replace(/\s+/g,' ').trim();return{amount:a,wallet:w,type:inc?'inc':'exp',cat:inc?'Income':cat,note:note||(inc?'Income':cat),ok:a>0}}
const ctx=()=>`Context: location ${S.region.city||''} ${cname(S.region.country)}, currency ${S.region.cur}, goals: ${S.goals.join(', ')||'none'}, wallets: ${VW().map(i=>WAL[i]).join(', ')}.`;
async function ai(task,prompt){const base=(S.workerUrl||WORKER).replace(/\/$/,'');let r;try{r=await fetch(base,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task,prompt:ctx()+'\n'+prompt})})}catch(e){throw new Error('Offline or the AI server is unreachable')}let j={};try{j=await r.json()}catch(e){}if(r.status===429)throw new Error('Gemini is busy right now (free-tier limit). Try again in a minute.');if(!r.ok)throw new Error(j.error||'AI error');return j.text}
// ---------- location ----------
async function detect(force){if(S.pin&&!force)return false;if(!force&&Date.now()-S.lastGeo<15*60e3)return false;S.lastGeo=Date.now();let c=null;
 try{const pos=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{maximumAge:600000,timeout:9000}));const j=await(await fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude='+pos.coords.latitude+'&longitude='+pos.coords.longitude+'&localityLanguage=en')).json();if(j.countryCode)c={cc:j.countryCode,city:j.city||j.locality||j.principalSubdivision||''}}catch(e){}
 if(!c){try{const j=await(await fetch(S.workerUrl.replace(/\/$/,'')+'/geo')).json();if(j.country)c={cc:j.country,city:j.city||''}}catch(e){}}
 if(!c)return false;
 if(c.cc===S.region.country){S.region.city=c.city||S.region.city;S.pending=null;save();return true}
 if(!force&&!(S.pending&&S.pending.cc===c.cc)){S.pending={cc:c.cc,city:c.city};save();return true}
 S.pending=null;applyPack(c.cc,c.city);save();toast(`Now in ${c.city?c.city+', ':''}${cname(c.cc)} · ${S.region.cur}`);loadFx();enrich();render();return true}
async function enrich(){if(PACKS[S.region.country]||(S.extra&&S.extra.country===S.region.country))return;try{const t=await ai('pack',`Typical grocery stores and savings options for a person in ${cname(S.region.country)}. Return the JSON.`);const j=JSON.parse(t);S.extra={country:S.region.country,stores:j.stores||'',save:(j.save||[]).map(x=>String(x).split(':').slice(0,2).map(y=>y.trim()))};save()}catch(e){}}

const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function key(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function enc(pw,obj){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const c=await crypto.subtle.encrypt({name:'AES-GCM',iv},await key(pw,salt),new TextEncoder().encode(JSON.stringify(obj)));return JSON.stringify({money:1,salt:b64(salt),iv:b64(iv),data:b64(c)})}
async function dec(pw,txt){const j=JSON.parse(txt);const p=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(j.iv)},await key(pw,unb64(j.salt)),unb64(j.data));return JSON.parse(new TextDecoder().decode(p))}

 sh.querySelectorAll('[data-k]').forEach(e=>e.onclick=()=>{haptic();const k=e.dataset.k;if(k==='⌫')draft.amt=draft.amt.slice(0,-1);else if(k==='.'){if(!draft.amt.includes('.'))draft.amt+=draft.amt?'.':'0.'}else if(draft.amt.length<9)draft.amt+=k;keep();drawAdd()});
 const keep=()=>{draft.note=$('#note').value;draft.tags=$('#tags').value};
 $('#note').oninput=keep;$('#tags').oninput=keep;
 $('#sent').onchange=async e=>{const txt=e.target.value;let r=parse(txt);if(!r.ok&&S.workerUrl){try{const j=JSON.parse(await ai('parse',txt));r={amount:+j.amount,wallet:VW().includes(j.wallet)?j.wallet:VW()[0],type:'exp',cat:CATS.includes(j.category)?j.category:'Other',note:j.note||txt,ok:+j.amount>0}}catch(x){}}
  if(!r.ok)return toast('Could not find an amount');draft.type=r.type;draft.amt=String(r.amount);draft.wallet=r.wallet;draft.cat=r.cat==='Income'?draft.cat:r.cat;draft.note=r.note;drawAdd();haptic()};
 $('#cx').onclick=closeAdd;
 $('#sv').onclick=()=>{keep();const a=parseFloat(draft.amt);if(!(a>0))return toast('Enter an amount');const t={id:Date.now(),ts:Date.now(),type:draft.type,amount:a,cur:S.region.cur,wallet:draft.wallet,tags:draft.tags.split(/[\s,]+/).filter(Boolean).map(x=>x.replace(/^#/,''))};if(draft.type==='xfer'){t.to=draft.to;t.note='Transfer'}else{t.cat=draft.type==='inc'?'Income':draft.cat;t.note=draft.note||(draft.type==='inc'?'Income':draft.cat)}S.tx.push(t);save();haptic();closeAdd();toast('Saved');render()}}
function closeAdd(){$('#modal').classList.remove('show')}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeAdd()};$('#fab').onclick=()=>openAdd('exp');
// ---------- boot ----------
function initRegion(){const cc=((navigator.language||'en-US').split('-')[1]||'US').toUpperCase();applyPack(CURM[cc]||PACKS[cc]?cc:'US','')}
function load(s){const v1=!s.region;S=JSON.parse(JSON.stringify(DEF));Object.assign(S,s);S.open={...(s.open||{})};['sg','bl','debts','chat'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});if(!S.rates)S.rates={};if(!Array.isArray(S.wallets))S.wallets=[];if(v1){S.region={country:'BD',city:'Dhaka',cur:'BDT'};S.wallets=[];S.packIds=[];applyPack('BD','Dhaka');S.openCur='BDT';S.onboarded=true}S.v=2;if(!S.workerUrl)S.workerUrl=WORKER;S.fx=S.fx||{rates:{},ts:0};S.manualRates=S.manualRates||{};S.goals=S.goals||[];S.packIds=S.packIds||[];syncWal()}
(async()=>{const s=await kvGet('state');if(s)load(s);else initRegion();
 matchMedia('(prefers-color-scheme:dark)').addEventListener&&matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>S.theme==='system'&&applyTheme());
 autoLog();render();loadFx();if(S.onboarded)detect(false);
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.onboarded){autoLog();detect(false);loadFx()}});
 if(new URLSearchParams(location.search).get('add')&&S.onboarded)openAdd('exp');
 if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{})})();
